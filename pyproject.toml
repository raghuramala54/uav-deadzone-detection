[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-sniffer"
version = "2.0.0"
description = "UAV-based wireless dead-zone and rogue access-point detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raja Raghu Ram Pydi" }]
keywords = ["uav", "drone", "wifi", "packet-sniffing", "dead-zone", "rogue-ap", "802.11", "coverage-path-planning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
capture = ["scapy>=2.5"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "scapy>=2.5", "matplotlib>=3.7"]

[project.scripts]
uav-sniffer = "uav_sniffer.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/uav-deadzone-detection"
Issues = "https://github.com/your-username/uav-deadzone-detection/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
